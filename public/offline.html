<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Device Offline - Mod Panel</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1C1C1E;
      --subtext-color: #666666;
      --accent-color: #6b21a8;
      --button-text: #ffffff;
      --button-bg: #6b21a8;
      --button-hover: #581c87;
      --shadow-color: rgba(107, 33, 168, 0.15);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0E0D08;
        --text-color: #ffffff;
        --subtext-color: #a3a3a3;
        --accent-color: #a855f7;
        --button-text: #ffffff;
        --button-bg: #a855f7;
        --button-hover: #9333ea;
        --shadow-color: rgba(168, 85, 247, 0.25);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .icon-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--shadow-color);
      border-radius: 50%;
      margin-bottom: 10px;
      animation: pulse 2s infinite ease-in-out;
    }

    .icon-container svg {
      width: 50px;
      height: 50px;
      stroke: var(--accent-color);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--shadow-color); }
      70% { box-shadow: 0 0 0 20px rgba(0,0,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
    }

    .text-content h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .text-content p {
      font-size: 16px;
      color: var(--subtext-color);
      line-height: 1.5;
    }

    button {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px var(--shadow-color);
      width: 100%;
      max-width: 220px;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.96);
      background-color: var(--button-hover);
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="text-content">
      <h1>Device Offline</h1>
      <p id="message">No internet connection.<br/>Check your connection and try again.</p>
    </div>
    <button id="retryButton" type="button" onclick="if(window.gonative && gonative.webview) { gonative.webview.reload(); } else { window.location.reload(); }">Retry</button>
  </div>

  <script>
    var message = document.getElementById('message');
    var retryButton = document.getElementById('retryButton');
    
    // Preserve translation support from original snippet
    if (['ko', 'ko-kr', 'ko-kp'].indexOf(navigator.language.toLowerCase()) > -1) {
      message.innerHTML = '인터넷 연결이 끊겼습니다.<br/>연결하고 다시 시도하시길 바랍니다.';
      retryButton.innerText = '다시 시도';
    }
  </script>
</body>
</html>
